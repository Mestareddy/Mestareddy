# Generates profile SVGs from YOUR commits across every repo you've contributed to
# (including Peerguard-Procurenet and other org repos). Needs a METRICS_TOKEN repo secret:
# classic personal access token with repo, read:org and read:user scopes.

name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 04:00 Lagos time
  workflow_dispatch:       # run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Languages across all contributed repos
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Mestareddy
          base: ""
          config_timezone: Africa/Lagos
          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          config_display: large
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_categories: programming, markup
          plugin_languages_ignored: dockerfile, shell, makefile, batchfile, procfile

      - name: Organizations and repos contributed to
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Mestareddy
          base: ""
          config_timezone: Africa/Lagos
          plugin_notable: yes
          config_display: large
          plugin_notable_from: organization
          plugin_notable_repositories: no
          plugin_notable_types: commit, pull_request

      - name: Stats and contribution calendar (replaces rate-limited public cards)
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Mestareddy
          base: header, activity, community
          config_timezone: Africa/Lagos
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
