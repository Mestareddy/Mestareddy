# Profile metrics, styled after a single consistent "classic" theme.
# Needs a METRICS_TOKEN repo secret: classic token with repo, read:org and read:user scopes.

name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 04:00 Lagos time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: profile-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Top - activity, community, repositories, lines of code
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update ${filename}"
          user: Mestareddy
          template: classic
          base: activity, community, repositories, metadata
          base_skip: header
          config_timezone: Africa/Lagos
          config_padding: 0, 8 + 15%
          plugins_errors_fatal: no
          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          config_order: base.activity+community, base.repositories, lines

      - name: Middle - contribution calendar and languages
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update ${filename}"
          user: Mestareddy
          template: classic
          base: metadata
          base_skip: header, activity, community, repositories
          config_timezone: Africa/Lagos
          config_padding: 0, 8 + 15%
          plugins_errors_fatal: no
          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          plugin_calendar: yes
          plugin_calendar_limit: 3
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: dockerfile, shell, makefile, batchfile, procfile
          config_order: calendar, languages

      - name: Bottom - achievements and organizations
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update ${filename}"
          user: Mestareddy
          template: classic
          base: metadata
          base_skip: header, activity, community, repositories
          config_timezone: Africa/Lagos
          config_padding: 0, 8 + 15%
          plugins_errors_fatal: no
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 8
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: no
          plugin_notable_types: commit, pull_request
          config_order: achievements, notable

  streak:
    runs-on: ubuntu-latest
    needs: metrics
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Mestareddy&border_radius=0&card_width=500&ring=0366D6&fire=0366D6&currStreakLabel=0366D6&border=FFFFFF00&background=FFFFFF00&stroke=FFFFFF00&currStreakNum=777777&sideNums=777777&sideLabels=777777&dates=959DA5&excludeDaysLabel=959DA5
          path: github-streak.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-streak.svg
          git diff --staged --quiet || git commit -m "chore: update github-streak.svg"
          git pull --rebase
          git push
