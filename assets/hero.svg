<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Edikan Bassey</title>
  <desc id="d">Senior full-stack engineer who builds interfaces that move. Animated banner with floating UI components.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
    <clipPath id="frame"><rect width="960" height="340" rx="22"/></clipPath>
    <clipPath id="sk1"><rect x="0" y="0" width="150" height="10" rx="5"/></clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .r1 { animation-delay: .1s } .r2 { animation-delay: .35s } .r3 { animation-delay: .6s } .r4 { animation-delay: .85s } .r5 { animation-delay: 1.1s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

    .blob1 { animation: drift1 14s ease-in-out infinite alternate; }
    .blob2 { animation: drift2 18s ease-in-out infinite alternate; }
    .blob3 { animation: drift3 16s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 40px) } }
    @keyframes drift2 { to { transform: translate(-140px, -30px) } }
    @keyframes drift3 { to { transform: translate(60px, -60px) } }

    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }

    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    .float3 { animation: float 5.5s ease-in-out -1s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }

    .in1 { opacity: 0; animation: pop .8s cubic-bezier(.2,.9,.25,1.2) .5s forwards; }
    .in2 { opacity: 0; animation: pop .8s cubic-bezier(.2,.9,.25,1.2) .8s forwards; }
    .in3 { opacity: 0; animation: pop .8s cubic-bezier(.2,.9,.25,1.2) 1.1s forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.94) } to { opacity: 1; transform: none } }

    .sweep { animation: sweep 2.4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-160px) } to { transform: translateX(160px) } }

    .knob { animation: toggle 3.2s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes toggle { 0%,40% { transform: translateX(0) } 50%,90% { transform: translateX(20px) } 100% { transform: translateX(0) } }
    .track-on { animation: trackon 3.2s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes trackon { 0%,40% { opacity: 0 } 50%,90% { opacity: 1 } 100% { opacity: 0 } }

    .fill { transform-box: fill-box; transform-origin: left center; animation: fill 3.6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes fill { 0% { transform: scaleX(.05) } 60%,85% { transform: scaleX(1) } 100% { transform: scaleX(.05) } }

    .bar { transform-box: fill-box; transform-origin: center bottom; animation: grow 2.8s ease-in-out infinite; }
    .b2 { animation-delay: -.4s } .b3 { animation-delay: -.8s } .b4 { animation-delay: -1.2s } .b5 { animation-delay: -1.6s } .b6 { animation-delay: -2s }
    @keyframes grow { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .55 } to { transform: scale(1.9); opacity: 0 } }

    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    .edge { stroke-dasharray: 240 2400; animation: trace 7s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: -2640 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise, .in1, .in2, .in3 { opacity: 1 !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="960" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".55">
      <circle class="blob1" cx="160" cy="70" r="120" fill="#2563eb"/>
      <circle class="blob2" cx="780" cy="280" r="140" fill="#7c3aed"/>
      <circle class="blob3" cx="620" cy="40" r="90" fill="#0891b2"/>
    </g>
    <rect width="960" height="340" fill="url(#dots)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="339" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <rect class="edge" x=".5" y=".5" width="959" height="339" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- Copy -->
  <g transform="translate(56 0)">
    <g class="rise r1">
      <rect x="0" y="66" width="248" height="26" rx="13" fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-opacity=".4"/>
      <circle cx="16" cy="79" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text class="mono" x="28" y="83.5" font-size="11.5" fill="#bfdbfe" letter-spacing="1.2">FULL-STACK · UI &amp; MOTION</text>
    </g>
    <text class="rise r2" x="0" y="148" font-size="50" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Edikan Bassey</text>
    <g class="rise r3">
      <text x="0" y="188" font-size="20" fill="#e2e8f0" font-weight="500">I build interfaces that <tspan fill="#67e8f9" font-weight="700">move</tspan>.</text>
      <rect class="caret" x="282" y="172" width="2.5" height="21" rx="1" fill="#67e8f9"/>
    </g>
    <text class="rise r4" x="0" y="220" font-size="14.5" fill="#94a3b8">Pixel-precise UI, fluid micro-interactions and 60fps animation,</text>
    <text class="rise r4" x="0" y="241" font-size="14.5" fill="#94a3b8">shipped on Next.js, TypeScript and Node.js for 6+ years.</text>
    <g class="rise r5" font-size="12" font-weight="600">
      <rect x="0" y="266" width="90" height="28" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="45" y="284.5" text-anchor="middle" fill="#e2e8f0">Next.js</text>
      <rect x="98" y="266" width="112" height="28" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="154" y="284.5" text-anchor="middle" fill="#e2e8f0">Framer Motion</text>
      <rect x="218" y="266" width="64" height="28" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="250" y="284.5" text-anchor="middle" fill="#e2e8f0">GSAP</text>
      <rect x="290" y="266" width="96" height="28" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="338" y="284.5" text-anchor="middle" fill="#e2e8f0">TypeScript</text>
    </g>
  </g>

  <!-- Floating UI: profile card -->
  <g class="in1"><g class="float1" filter="url(#shadow)">
    <rect x="560" y="52" width="230" height="118" rx="16" fill="#111a33" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="596" cy="90" r="18" fill="url(#bar)"/>
    <circle class="pulse" cx="596" cy="90" r="18" fill="none" stroke="#a855f7" stroke-width="2"/>
    <rect x="624" y="80" width="120" height="9" rx="4.5" fill="#ffffff" fill-opacity=".85"/>
    <rect x="624" y="96" width="80" height="7" rx="3.5" fill="#ffffff" fill-opacity=".3"/>
    <g transform="translate(580 124)">
      <rect width="190" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
      <g clip-path="url(#sk1)"><rect class="sweep" x="0" y="0" width="150" height="10" fill="url(#shine)"/></g>
    </g>
    <rect x="580" y="142" width="130" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
  </g></g>

  <!-- Floating UI: settings card with toggle + progress -->
  <g class="in2"><g class="float2" filter="url(#shadow)">
    <rect x="700" y="150" width="210" height="120" rx="16" fill="#111a33" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="720" y="180" font-size="12.5" font-weight="600" fill="#e2e8f0">Reduce motion</text>
    <g transform="translate(852 168)">
      <rect width="42" height="22" rx="11" fill="#334155"/>
      <rect class="track-on" width="42" height="22" rx="11" fill="url(#bar)"/>
      <circle class="knob" cx="11" cy="11" r="8" fill="#ffffff"/>
    </g>
    <text x="720" y="214" font-size="11" fill="#94a3b8">Deploying to production</text>
    <rect x="720" y="224" width="170" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
    <rect class="fill" x="720" y="224" width="170" height="8" rx="4" fill="url(#bar)"/>
    <circle class="spin" cx="886" cy="210" r="6" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="20 18" stroke-linecap="round"/>
    <text x="720" y="254" font-size="10.5" fill="#64748b" class="mono">60fps · 0 layout shift</text>
  </g></g>

  <!-- Floating UI: chart -->
  <g class="in3"><g class="float3" filter="url(#shadow)">
    <rect x="540" y="200" width="140" height="100" rx="16" fill="#111a33" stroke="#ffffff" stroke-opacity=".1"/>
    <g fill="url(#bar)">
      <rect class="bar" x="558" y="236" width="12" height="48" rx="3"/>
      <rect class="bar b2" x="576" y="236" width="12" height="48" rx="3"/>
      <rect class="bar b3" x="594" y="236" width="12" height="48" rx="3"/>
      <rect class="bar b4" x="612" y="236" width="12" height="48" rx="3"/>
      <rect class="bar b5" x="630" y="236" width="12" height="48" rx="3"/>
      <rect class="bar b6" x="648" y="236" width="12" height="48" rx="3"/>
    </g>
    <rect x="558" y="214" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity=".5"/>
  </g></g>
</svg>
