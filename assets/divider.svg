<svg xmlns="http://www.w3.org/2000/svg" width="960" height="14" viewBox="0 0 960 14" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset=".3" stop-color="#3b82f6"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset=".7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="6" width="960" height="2" rx="1"/></clipPath>
  </defs>
  <style>
    .run { animation: run 4s cubic-bezier(.65,0,.35,1) infinite; }
